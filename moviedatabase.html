<!DOCTYPE html>
<html lang="en">
<head>
    <title>Enhanced Movie Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
            color: #E0FFFF;
            margin: 0;
            padding: 0;
        }
        header {
            background: #232F3E ;
            color: #E0FFFF;
            padding: 1rem;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .movie-card {
            background-color: slategray;
            border-radius: 5px ;
            
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
            padding: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        .movie-card img {
            width: 120px;
            border-radius: 5px solid black;
        }
        .movie-details h3 {
            margin: 0 0 0.5rem 0;
        }
        .movie-details p {
            margin: 0.3rem 0;
        }
        .rating {
            color: red;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header>
        <h1>Movie Database</h1>
    </header>

    <div class="container" id="movieContainer">
        <!-- Movies will appear here -->
    </div>

    <script>
        const movies = [
            {
                title: "Evaru",
                year: 2019,
                genre: "Thriller/Mystery",
                rating: "8.8/10",
                director: "Venkat Ramj",
                actors: "Adivi Sesh",
                actress: "Regina",
                poster: "evaruu.jpg"
            },
            {
              title: "Gabbar Singh",
        year: 2012,
        genre: "Action, Comedy",
        rating: "8.5/10",
        director: "Harish Shankar",
        actors: "Pawan Kalyan, Shruti Haasan",
        actress: "Shruti Haasan",
        poster: "gabbar singh.jpg"
            },
            {
        title: "The Imitation Game",
        year: 2014,
        genre: "Biography, Drama, Thriller",
        rating: "8.0/10",
        director: "Morten Tyldum",
        actors: "Benedict Cumberbatch, Keira Knightley",
        actress: "Keira Knightley",
        poster: "imitation game.jpg"

            }
        ];

        const container = document.getElementById('movieContainer');

        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img src="${movie.poster}" alt="${movie.title}">
                <div class="movie-details">
                    <h3>${movie.title}</h3>
                    <p><strong>Year:</strong> ${movie.year}</p>
                    <p><strong>Genre:</strong> ${movie.genre}</p>
                    <p><strong>Rating:</strong> <span class="rating">${movie.rating}</span></p>
                    <p><strong>Director:</strong> ${movie.director}</p>
                    <p><strong>Actor:</strong> ${movie.actors}</p>
                    <p><strong>Actress:</strong> ${movie.actress}</p>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
